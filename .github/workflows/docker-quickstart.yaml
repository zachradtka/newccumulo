# Builds the quickstart Docker image off the freshly-built tarball, boots it,
# runs a shell command against the monitor URL until it's serving, exercises a
# create-table / insert / scan round-trip through `accumulo shell` via
# `docker exec`, then asserts a clean shutdown via `docker stop`.
#
# It then reuses the same image to check the Slice 4 behavior: the host-aware
# security warning fires under (non-loopback advertise + default password) and
# stays silent when the password is overridden, and a second container can
# connect through the `accumulo` compose service name.

name: Docker Quickstart Smoke Test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Build the quickstart image (tarball + docker build)
        # `verify`, not `package`: maven-assembly-plugin runs last in the
        # package phase, so the docker steps must observe the tarball from a
        # later phase. See the docker-quickstart profile comment in
        # assemble/pom.xml.
        #
        # checkstyle/spotbugs are skipped here: this job validates the Docker
        # image, and the QA workflow already owns static analysis. Skipping
        # keeps the smoke test from going red on a style nit in an unrelated
        # module.
        run: |
          mvn -B -V -e -ntp "-Dstyle.color=always" \
              -P docker-quickstart \
              -Ddocker.image.tag=ci \
              -DskipTests -DskipFormat \
              -Dcheckstyle.skip=true -Dspotbugs.skip=true \
              clean verify
        env:
          MAVEN_OPTS: -Djansi.force=true

      - name: Boot the quickstart container
        run: |
          docker run -d --name accumulo-quickstart \
            -p 2181:2181 -p 9995:9995 -p 9997:9997 -p 9999:9999 \
            ghcr.io/zachradtka/newccumulo:ci
          docker ps

      - name: Wait for the monitor to serve
        run: |
          set -eux
          # Up to 3 minutes - quickstart's readiness check itself is 60s; allow
          # headroom for CI cold-start of six JVMs.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:9995/ >/dev/null; then
              echo "monitor up after ${i}s"
              break
            fi
            if [[ $i -eq 90 ]]; then
              echo "monitor did not come up; dumping container logs"
              docker logs accumulo-quickstart || true
              exit 1
            fi
            sleep 2
          done

      - name: Create table / insert row / scan via docker exec
        run: |
          set -eux
          # Run accumulo shell as the unprivileged accumulo user. gosu in the
          # entrypoint is bypassed here because docker exec runs as the image's
          # USER (root - we drop privileges in the entrypoint only, not via a
          # USER instruction), so pass -u to run the shell as accumulo.
          #
          # -zi/-zh are passed explicitly: the bundled accumulo-client.properties
          # ships with an empty instance.name, so the shell cannot discover the
          # instance on its own.
          shell() {
            docker exec -u accumulo accumulo-quickstart \
              /opt/accumulo/bin/accumulo shell -zh localhost:2181 -zi quickstart \
              -u root -p secret -e "$1"
          }
          shell "createtable smoke" 2>&1 | tee /tmp/createtable.log
          shell "insert -t smoke r1 cf1 cq1 v1" 2>&1 | tee /tmp/insert.log
          shell "scan -t smoke" 2>&1 | tee /tmp/scan.log
          grep -q "r1 cf1:cq1" /tmp/scan.log

      - name: Clean shutdown via docker stop
        run: |
          set -eux
          # Default SIGTERM grace is 10s. Quickstart's shutdown hook + tini
          # forwarding should land well inside that.
          docker stop accumulo-quickstart
          # Sanity: container must have exited within the grace period; if
          # docker had to SIGKILL we'd see exit code 137.
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' accumulo-quickstart)
          echo "container exit code: ${exit_code}"
          test "${exit_code}" != "137"

      - name: Dump container logs on failure
        if: failure()
        run: docker logs accumulo-quickstart || true

      - name: Tear down
        if: always()
        run: docker rm -f accumulo-quickstart || true

      # ----------------------------------------------------------------------
      # Slice 4: host-aware security warning
      #
      # --hostname accumulo gives the container a non-loopback name it can
      # resolve back to its own bridge IP, so ACCUMULO_ADVERTISE_HOST=accumulo
      # is both a genuine non-loopback advertise host (which trips the warning)
      # and reachable by the in-container readiness check (so the cluster
      # actually reaches "ready" and prints the banner).
      # ----------------------------------------------------------------------
      - name: Security warning present (non-loopback advertise + default password)
        run: |
          set -eux
          docker run -d --name accumulo-warn \
            --hostname accumulo \
            -e ACCUMULO_ADVERTISE_HOST=accumulo \
            ghcr.io/zachradtka/newccumulo:ci
          # Wait up to 4 minutes for the ready banner to land in the logs.
          for i in $(seq 1 120); do
            if docker logs accumulo-warn 2>&1 | grep -q "Quickstart - ready"; then
              echo "banner appeared after ${i} polls"
              break
            fi
            if [[ $i -eq 120 ]]; then
              echo "ready banner never appeared; dumping logs"
              docker logs accumulo-warn || true
              exit 1
            fi
            sleep 2
          done
          # The warning block must be present.
          docker logs accumulo-warn 2>&1 | grep -q "SECURITY WARNING"

      - name: Tear down warning container
        if: always()
        run: docker rm -f accumulo-warn || true

      - name: Security warning absent (root password overridden)
        run: |
          set -eux
          docker run -d --name accumulo-secure \
            --hostname accumulo \
            -e ACCUMULO_ADVERTISE_HOST=accumulo \
            -e ACCUMULO_ROOT_PASSWORD=ci-strong-password \
            ghcr.io/zachradtka/newccumulo:ci
          for i in $(seq 1 120); do
            if docker logs accumulo-secure 2>&1 | grep -q "Quickstart - ready"; then
              echo "banner appeared after ${i} polls"
              break
            fi
            if [[ $i -eq 120 ]]; then
              echo "ready banner never appeared; dumping logs"
              docker logs accumulo-secure || true
              exit 1
            fi
            sleep 2
          done
          # Overriding the password must suppress the warning even though the
          # advertise host is non-loopback.
          if docker logs accumulo-secure 2>&1 | grep -q "SECURITY WARNING"; then
            echo "warning was printed despite an overridden root password"
            docker logs accumulo-secure || true
            exit 1
          fi

      - name: Tear down secure container
        if: always()
        run: docker rm -f accumulo-secure || true

      # ----------------------------------------------------------------------
      # Slice 4: docker-compose connectivity
      #
      # The compose `client` service connects to the cluster through the
      # `accumulo` service name on the compose network and runs a shell
      # round-trip. --exit-code-from client propagates the client's exit code,
      # and --abort-on-container-exit stops the never-exiting `accumulo`
      # service once the client is done.
      # ----------------------------------------------------------------------
      - name: docker-compose connectivity check
        env:
          ACCUMULO_IMAGE: ghcr.io/zachradtka/newccumulo:ci
        run: |
          set -eux
          docker compose -f assemble/docker/quickstart/docker-compose.yml \
            up --abort-on-container-exit --exit-code-from client

      - name: Dump compose logs on failure
        if: failure()
        run: |
          docker compose -f assemble/docker/quickstart/docker-compose.yml logs || true

      - name: Tear down compose
        if: always()
        run: |
          docker compose -f assemble/docker/quickstart/docker-compose.yml down -v || true
